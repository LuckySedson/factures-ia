name: factures-ia

services:
  postgres:
    image: postgres:18
    container_name: factures-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FACTURES_POSTGRES_DB}
      POSTGRES_USER: ${FACTURES_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FACTURES_POSTGRES_PASSWORD}
    ports:
      - "${FACTURES_POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FACTURES_POSTGRES_USER} -d ${FACTURES_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: factures-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      NODES_EXCLUDE: "[]"
      N8N_RESTRICT_FILE_ACCESS_TO: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./inbox:/data/inbox

volumes:
  pgdata:
  n8n_data: